<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Marvel Dice Settings</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap');
        
        :root {
            --marvel-red: #e23636;
            --marvel-blue: #518cca;
            --marvel-dark-blue: #1d4e89;
            --marvel-yellow: #ffd700;
            --title-font: 'Montserrat', sans-serif;
        }
        
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            color: white;
            background-color: #222;
            position: fixed;
        }

        #app-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
            z-index: 2;
        }

        #header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: linear-gradient(135deg, var(--marvel-red), #a12626);
            height: 60px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.5);
        }

        #header-title {
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            flex: 1;
            font-family: var(--title-font);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }

        .back-btn {
            padding: 8px 15px;
            background: var(--marvel-blue);
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .settings-content {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }

        .settings-section {
            margin-bottom: 25px;
        }

        .settings-section-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            padding-bottom: 5px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .colorset-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .colorset-item {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 12px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .colorset-item.active {
            background: rgba(52, 152, 219, 0.3);
            box-shadow: 0 0 0 2px #3498db;
        }

        .colorset-preview {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            margin-bottom: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 20px;
            background-size: cover;
            position: relative;
            overflow: hidden;
        }

        .colorset-name {
            font-size: 14px;
            text-align: center;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .colorset-category {
            font-size: 11px;
            color: #aaa;
            margin-top: 3px;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .settings-footer {
            padding: 15px;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
        }

        .save-btn {
            width: 100%;
            max-width: 300px;
            padding: 12px;
            background: #2ecc71;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .save-btn:hover {
            background: #27ae60;
            transform: translateY(-1px);
            box-shadow: 0 3px 7px rgba(0,0,0,0.25);
        }

        /* For colorset preview backgrounds */
        .bg-gradient {
            background: linear-gradient(45deg, var(--color1), var(--color2));
        }

        .bg-solid {
            background-color: var(--color);
        }

        .texture-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            opacity: 0.5;
            background-size: cover;
        }

        .texture-marble { background-image: url('assets/textures/marble.webp'); }
        .texture-ice { background-image: url('assets/textures/ice.webp'); }
        .texture-fire { background-image: url('assets/textures/fire.webp'); }
        .texture-cloudy { background-image: url('assets/textures/cloudy.webp'); }
        .texture-speckles { background-image: url('assets/textures/speckles.webp'); }
        .texture-stars { background-image: url('assets/textures/stars.webp'); }
        .texture-skulls { background-image: url('assets/textures/skulls.webp'); }

        /* Tab navigation for different settings */
        .tabs {
            display: flex;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .tab {
            padding: 10px 15px;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            color: white;
            white-space: nowrap;
        }

        .tab.active {
            border-bottom-color: var(--marvel-blue);
            font-weight: bold;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Filter controls */
        .filter-controls {
            display: flex;
            margin-bottom: 15px;
            overflow-x: auto;
            padding-bottom: 5px;
            -webkit-overflow-scrolling: touch;
        }

        .filter-btn {
            padding: 6px 12px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 15px;
            color: white;
            margin-right: 8px;
            white-space: nowrap;
            font-size: 12px;
            cursor: pointer;
        }

        .filter-btn.active {
            background: var(--marvel-blue);
        }
        
        /* Slider styling */
        .slider-container {
            margin-bottom: 15px;
        }
        
        .slider-container label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }
        
        .slider {
            width: 100%;
            height: 8px;
            border-radius: 4px;
            background: #555;
            outline: none;
            -webkit-appearance: none;
        }
        
        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--marvel-blue);
            cursor: pointer;
        }
        
        .slider::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--marvel-blue);
            cursor: pointer;
            border: none;
        }
        
        /* Checkbox styling */
        .checkbox-container {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .checkbox-container input[type="checkbox"] {
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <div id="app-container">
        <!-- Header -->
        <div id="header">
            <button class="back-btn" id="back-button">←</button>
            <div id="header-title">Marvel Dice Settings</div>
            <div style="width: 40px;"></div> <!-- Spacer for balance -->
        </div>
        
        <!-- Tab Navigation -->
        <div class="tabs">
            <!-- <div class="tab" data-tab="white-dice">White Dice</div>
            <div class="tab" data-tab="marvel-dice">Marvel Die</div> -->
            <div class="tab active" data-tab="textures">Textures</div>
            <div class="tab" data-tab="materials">Materials</div>
            <!-- <div class="tab" data-tab="surface">Surface</div> -->
            <div class="tab" data-tab="other">Physics & Audio</div>
        </div>
        
        <!-- Settings Content -->
        <div class="settings-content">
            <!-- White Dice Tab -->
            <div class="tab-content" id="white-dice-tab">
                <div class="filter-controls">
                    <!-- <button class="filter-btn active" data-category="all">All</button> -->
                    <button class="filter-btn" data-category="Colors">Colors</button>
                    <button class="filter-btn" data-category="Elements">Elements</button>
                    <button class="filter-btn" data-category="Custom Sets">Custom</button>
                </div>
                
                <div class="colorset-grid" id="white-colorset-grid">
                    <!-- Colorset items will be generated here -->
                </div>
            </div>
            
            <!-- Marvel Die Tab -->
            <div class="tab-content" id="marvel-dice-tab">
                <div class="filter-controls">
                    <button class="filter-btn active" data-category="all">All</button>
                    <button class="filter-btn" data-category="Damage Types">Damage Types</button>
                    <button class="filter-btn" data-category="Elements">Elements</button>
                    <button class="filter-btn" data-category="Custom Sets">Custom</button>
                </div>
                
                <div class="colorset-grid" id="marvel-colorset-grid">
                    <!-- Colorset items will be generated here -->
                </div>
            </div>
            
            <!-- Textures Tab -->
            <div class="tab-content active" id="textures-tab">
                <div class="settings-section">
                    <div class="settings-section-title">Dice Textures</div>
                    <div class="colorset-grid" id="texture-grid">
                        <!-- Texture items will be added here -->
                        <div class="colorset-item" data-texture="marble">
                            <div class="colorset-preview">
                                <div class="texture-overlay texture-marble"></div>
                            </div>
                            <div class="colorset-name">Marble</div>
                        </div>
                        <div class="colorset-item" data-texture="ice">
                            <div class="colorset-preview">
                                <div class="texture-overlay texture-ice"></div>
                            </div>
                            <div class="colorset-name">Ice</div>
                        </div>
                        <div class="colorset-item" data-texture="fire">
                            <div class="colorset-preview">
                                <div class="texture-overlay texture-fire"></div>
                            </div>
                            <div class="colorset-name">Fire</div>
                        </div>
                        <div class="colorset-item" data-texture="cloudy">
                            <div class="colorset-preview">
                                <div class="texture-overlay texture-cloudy"></div>
                            </div>
                            <div class="colorset-name">Cloudy</div>
                        </div>
                        <div class="colorset-item" data-texture="speckles">
                            <div class="colorset-preview">
                                <div class="texture-overlay texture-speckles"></div>
                            </div>
                            <div class="colorset-name">Speckles</div>
                        </div>
                        <div class="colorset-item" data-texture="stars">
                            <div class="colorset-preview">
                                <div class="texture-overlay texture-stars"></div>
                            </div>
                            <div class="colorset-name">Stars</div>
                        </div>
                        <div class="colorset-item" data-texture="skulls">
                            <div class="colorset-preview">
                                <div class="texture-overlay texture-skulls"></div>
                            </div>
                            <div class="colorset-name">Skulls</div>
                        </div>
                        <div class="colorset-item" data-texture="none">
                            <div class="colorset-preview"></div>
                            <div class="colorset-name">None</div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Materials Tab -->
            <div class="tab-content" id="materials-tab">
                <div class="settings-section">
                    <div class="settings-section-title">Dice Materials</div>
                    <div class="colorset-grid">
                        <div class="colorset-item" data-material="metal">
                            <div class="colorset-preview">M</div>
                            <div class="colorset-name">Metal</div>
                        </div>
                        <div class="colorset-item" data-material="wood">
                            <div class="colorset-preview">W</div>
                            <div class="colorset-name">Wood</div>
                        </div>
                        <div class="colorset-item" data-material="glass">
                            <div class="colorset-preview">G</div>
                            <div class="colorset-name">Glass</div>
                        </div>
                        <div class="colorset-item" data-material="plastic">
                            <div class="colorset-preview">P</div>
                            <div class="colorset-name">Plastic</div>
                        </div>
                        <div class="colorset-item" data-material="none">
                            <div class="colorset-preview">-</div>
                            <div class="colorset-name">None</div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Surface Tab -->
            <div class="tab-content" id="surface-tab">
                <div class="settings-section">
                    <div class="settings-section-title">Rolling Surface</div>
                    <div class="colorset-grid">
                        <div class="colorset-item" data-surface="green-felt">
                            <div class="colorset-preview" style="background-color: #1b5e20;"></div>
                            <div class="colorset-name">Green Felt</div>
                        </div>
                        <div class="colorset-item" data-surface="red-felt">
                            <div class="colorset-preview" style="background-color: #b71c1c;"></div>
                            <div class="colorset-name">Red Felt</div>
                        </div>
                        <div class="colorset-item" data-surface="blue-felt">
                            <div class="colorset-preview" style="background-color: #0d47a1;"></div>
                            <div class="colorset-name">Blue Felt</div>
                        </div>
                        <div class="colorset-item" data-surface="black-felt">
                            <div class="colorset-preview" style="background-color: #212121;"></div>
                            <div class="colorset-name">Black Felt</div>
                        </div>
                    </div>
                </div>
            </div>
                
            <!-- Other Settings Tab -->
            <div class="tab-content" id="other-tab">
                <div class="settings-section">
                    <div class="settings-section-title">Physics</div>
                    <div class="slider-container">
                        <label for="gravity-slider">Gravity: <span id="gravity-value">200</span></label>
                        <input type="range" min="100" max="300" value="200" class="slider" id="gravity-slider">
                    </div>
                    <div class="slider-container">
                        <label for="strength-slider">Toss Strength: <span id="strength-value">1.5</span></label>
                        <input type="range" min="0.5" max="3" value="1.5" step="0.1" class="slider" id="strength-slider">
                    </div>
                </div>
                
                <div class="settings-section">
                    <div class="settings-section-title">Audio & Graphics</div>
                    <div class="slider-container">
                        <label for="volume-slider">Volume: <span id="volume-value">100</span>%</label>
                        <input type="range" min="0" max="100" value="100" class="slider" id="volume-slider">
                    </div>
                    <div class="checkbox-container">
                        <input type="checkbox" id="shadows-checkbox" checked>
                        <label for="shadows-checkbox">Enable Shadows</label>
                    </div>
                    <div class="checkbox-container">
                        <input type="checkbox" id="sounds-checkbox" checked>
                        <label for="sounds-checkbox">Enable Sounds</label>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Footer with save button -->
        <div class="settings-footer">
            <button class="save-btn" id="save-settings">Save Changes</button>
        </div>
    </div>

    <script>
        // Colorsets data
        const COLORSETS = {
        'white': {
            name: 'White',
            category: 'Colors',
            foreground: '#000000',
            background: '#FFFFFF',
            outline: '#FFFFFF',
            texture: 'none',
            description: 'White'
            },
          'black': {
            name: 'Black',
            category: 'Colors',
            foreground: '#ffffff',
            background: '#000000',
            outline: 'black',
            texture: 'none',
            description: 'Black',
          },
        };

        document.addEventListener('DOMContentLoaded', () => {
            // Current settings (default values)
            let currentSettings = {
                texture: 'marble',
                material: 'plastic',
                surface: 'green-felt',
                gravity: 200,
                strength: 1.5,
                volume: 100,
                shadows: true,
                sounds: true
            };
            
            // Try to load saved settings from localStorage
            try {
                const savedSettings = localStorage.getItem('marvelDiceSettings');
                if (savedSettings) {
                    currentSettings = {...currentSettings, ...JSON.parse(savedSettings)};
                }
            } catch (e) {
                console.error('Error loading saved settings:', e);
            }
            
            // Update displayed values
            document.getElementById('gravity-value').textContent = currentSettings.gravity;
            document.getElementById('strength-value').textContent = currentSettings.strength;
            document.getElementById('volume-value').textContent = currentSettings.volume;
            
            // Generate colorset items for White Dice
            const whiteColorsetGrid = document.getElementById('white-colorset-grid');
            function generateWhiteColorsetItems(filter = 'all') {
                whiteColorsetGrid.innerHTML = '';
                
                Object.entries(COLORSETS).forEach(([key, colorset]) => {
                    if (filter !== 'all' && colorset.category !== filter) return;
                    
                    const item = document.createElement('div');
                    item.className = 'colorset-item';
                    item.dataset.colorset = key;
                    
                    if (key === currentSettings.white_colorset) {
                        item.classList.add('active');
                    }
                    
                    const preview = document.createElement('div');
                    preview.className = 'colorset-preview';
                    
                    // Handle colorset preview background
                    if (Array.isArray(colorset.background)) {
                        // Get the first two colors for the gradient
                        preview.style.setProperty('--color1', colorset.background[0]);
                        preview.style.setProperty('--color2', colorset.background[1] || colorset.background[0]);
                        preview.classList.add('bg-gradient');
                    } else {
                        preview.style.setProperty('--color', colorset.background);
                        preview.classList.add('bg-solid');
                    }
                    
                    // Add text in the foreground color
                    preview.style.color = Array.isArray(colorset.foreground) ? colorset.foreground[0] : colorset.foreground;
                    preview.textContent = 'D6';
                    
                    // Add texture overlay if applicable
                    if (colorset.texture && colorset.texture !== 'none') {
                        const textureOverlay = document.createElement('div');
                        textureOverlay.className = `texture-overlay texture-${Array.isArray(colorset.texture) ? colorset.texture[0] : colorset.texture}`;
                        preview.appendChild(textureOverlay);
                    }
                    
                    const name = document.createElement('div');
                    name.className = 'colorset-name';
                    name.textContent = colorset.name;
                    
                    const category = document.createElement('div');
                    category.className = 'colorset-category';
                    category.textContent = colorset.category;
                    
                    item.appendChild(preview);
                    item.appendChild(name);
                    item.appendChild(category);
                    
                    item.addEventListener('click', () => {
                        // Remove active class from all items
                        document.querySelectorAll('#white-colorset-grid .colorset-item').forEach(el => {
                            el.classList.remove('active');
                        });
                        
                        // Add active class to clicked item
                        item.classList.add('active');
                        
                        // Update current settings
                        currentSettings.white_colorset = key;
                    });
                    
                    whiteColorsetGrid.appendChild(item);
                });
            }
            
            // Generate colorset items for Marvel Die
            const marvelColorsetGrid = document.getElementById('marvel-colorset-grid');
            function generateMarvelColorsetItems(filter = 'all') {
                marvelColorsetGrid.innerHTML = '';
                
                Object.entries(COLORSETS).forEach(([key, colorset]) => {
                    if (filter !== 'all' && colorset.category !== filter) return;
                    
                    const item = document.createElement('div');
                    item.className = 'colorset-item';
                    item.dataset.colorset = key;
                    
                    if (key === currentSettings.marvel_colorset) {
                        item.classList.add('active');
                    }
                    
                    const preview = document.createElement('div');
                    preview.className = 'colorset-preview';
                    
                    // Handle colorset preview background
                    if (Array.isArray(colorset.background)) {
                        // Get the first two colors for the gradient
                        preview.style.setProperty('--color1', colorset.background[0]);
                        preview.style.setProperty('--color2', colorset.background[1] || colorset.background[0]);
                        preview.classList.add('bg-gradient');
                    } else {
                        preview.style.setProperty('--color', colorset.background);
                        preview.classList.add('bg-solid');
                    }
                    
                    // Add text in the foreground color
                    preview.style.color = Array.isArray(colorset.foreground) ? colorset.foreground[0] : colorset.foreground;
                    preview.textContent = 'D6';
                    
                    // Add texture overlay if applicable
                    if (colorset.texture && colorset.texture !== 'none') {
                        const textureOverlay = document.createElement('div');
                        textureOverlay.className = `texture-overlay texture-${Array.isArray(colorset.texture) ? colorset.texture[0] : colorset.texture}`;
                        preview.appendChild(textureOverlay);
                    }
                    
                    const name = document.createElement('div');
                    name.className = 'colorset-name';
                    name.textContent = colorset.name;
                    
                    const category = document.createElement('div');
                    category.className = 'colorset-category';
                    category.textContent = colorset.category;
                    
                    item.appendChild(preview);
                    item.appendChild(name);
                    item.appendChild(category);
                    
                    item.addEventListener('click', () => {
                        // Remove active class from all items
                        document.querySelectorAll('#marvel-colorset-grid .colorset-item').forEach(el => {
                            el.classList.remove('active');
                        });
                        
                        // Add active class to clicked item
                        item.classList.add('active');
                        
                        // Update current settings
                        currentSettings.marvel_colorset = key;
                    });
                    
                    marvelColorsetGrid.appendChild(item);
                });
            }
            
            // Generate initial colorset items
            generateWhiteColorsetItems();
            generateMarvelColorsetItems();
            
            // Set up category filter buttons for White Dice
            document.querySelectorAll('#white-dice-tab .filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    // Remove active class from all filter buttons in white dice tab
                    document.querySelectorAll('#white-dice-tab .filter-btn').forEach(el => {
                        el.classList.remove('active');
                    });
                    
                    // Add active class to clicked button
                    btn.classList.add('active');
                    
                    // Generate filtered colorset items
                    generateWhiteColorsetItems(btn.dataset.category);
                });
            });
            
            // Set up category filter buttons for Marvel Die
            document.querySelectorAll('#marvel-dice-tab .filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    // Remove active class from all filter buttons in marvel dice tab
                    document.querySelectorAll('#marvel-dice-tab .filter-btn').forEach(el => {
                        el.classList.remove('active');
                    });
                    
                    // Add active class to clicked button
                    btn.classList.add('active');
                    
                    // Generate filtered colorset items
                    generateMarvelColorsetItems(btn.dataset.category);
                });
            });
            
            // Set up texture selection
            document.querySelectorAll('#texture-grid .colorset-item').forEach(item => {
                if (item.dataset.texture === currentSettings.texture) {
                    item.classList.add('active');
                }
                
                item.addEventListener('click', () => {
                    document.querySelectorAll('#texture-grid .colorset-item').forEach(el => {
                        el.classList.remove('active');
                    });
                    
                    item.classList.add('active');
                    currentSettings.texture = item.dataset.texture;
                });
            });
            
            // Set up material selection
            document.querySelectorAll('#materials-tab .colorset-item').forEach(item => {
                if (item.dataset.material === currentSettings.material) {
                    item.classList.add('active');
                }
                
                item.addEventListener('click', () => {
                    document.querySelectorAll('#materials-tab .colorset-item').forEach(el => {
                        el.classList.remove('active');
                    });
                    
                    item.classList.add('active');
                    currentSettings.material = item.dataset.material;
                });
            });
            
            // Set up surface selection
            document.querySelectorAll('[data-surface]').forEach(item => {
                if (item.dataset.surface === currentSettings.surface) {
                    item.classList.add('active');
                }
                
                item.addEventListener('click', () => {
                    document.querySelectorAll('[data-surface]').forEach(el => {
                        el.classList.remove('active');
                    });
                    
                    item.classList.add('active');
                    currentSettings.surface = item.dataset.surface;
                });
            });
            
            // Set up slider values
            document.getElementById('gravity-slider').value = currentSettings.gravity;
            document.getElementById('strength-slider').value = currentSettings.strength;
            document.getElementById('volume-slider').value = currentSettings.volume;
            
            // Set up checkbox values
            document.getElementById('shadows-checkbox').checked = currentSettings.shadows;
            document.getElementById('sounds-checkbox').checked = currentSettings.sounds;
            
            // Set up slider event listeners
            document.getElementById('gravity-slider').addEventListener('input', (e) => {
                currentSettings.gravity = parseInt(e.target.value);
                document.getElementById('gravity-value').textContent = e.target.value;
            });
            
            document.getElementById('strength-slider').addEventListener('input', (e) => {
                currentSettings.strength = parseFloat(e.target.value);
                document.getElementById('strength-value').textContent = e.target.value;
            });
            
            document.getElementById('volume-slider').addEventListener('input', (e) => {
                currentSettings.volume = parseInt(e.target.value);
                document.getElementById('volume-value').textContent = e.target.value;
            });
            
            // Set up checkbox event listeners
            document.getElementById('shadows-checkbox').addEventListener('change', (e) => {
                currentSettings.shadows = e.target.checked;
            });
            
            document.getElementById('sounds-checkbox').addEventListener('change', (e) => {
                currentSettings.sounds = e.target.checked;
            });
            
            // Save settings
            document.getElementById('save-settings').addEventListener('click', () => {
                try {
                    localStorage.setItem('marvelDiceSettings', JSON.stringify(currentSettings));
                    
                    // Provide feedback
                    alert('Settings saved successfully! Returning to character sheet.');
                    
                    // Go back to the correct file
                    window.location.href = 'mmrpg-character-sheet-styled-3d-dice.html';
                } catch (e) {
                    console.error('Error saving settings:', e);
                    alert('Error saving settings. Please try again.');
                }
            });
            
            // Back button
            document.getElementById('back-button').addEventListener('click', () => {
                window.location.href = 'index.html';
            });
            
            // Set up tab navigation
            document.querySelectorAll('.tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    // Remove active class from all tabs and content
                    document.querySelectorAll('.tab, .tab-content').forEach(el => {
                        el.classList.remove('active');
                    });
                    
                    // Add active class to clicked tab and corresponding content
                    tab.classList.add('active');
                    document.getElementById(`${tab.dataset.tab}-tab`).classList.add('active');
                });
            });
        });
    </script>
</body>
</html>
